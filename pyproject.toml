[project]
name = "negotiator"
version = "0.1.0"
description = "Hollerau buyer agents for the Tacto Negotiation Arena: code sets terms, the model reads and writes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["arena-kit[sim]", "anthropic>=1.0"]

[project.scripts]
negotiator = "negotiator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
arena-kit = { path = "negotiation-agent/negotiation-arena-kit/starter-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["negotiator"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["negotiation-agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
